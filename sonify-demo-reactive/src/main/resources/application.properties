spring.application.name=sonify-demo-reactive

sonify.enabled=true
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/sonify
spring.datasource.username=${USER:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=sonify-reactive-pool

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5s

scenarios.upstream.base-url=http://localhost:8090

management.endpoints.web.exposure.include=health,info,sonify

logging.level.net.bitsar.sonify=INFO
