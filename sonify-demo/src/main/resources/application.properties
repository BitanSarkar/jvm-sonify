spring.application.name=sonify-demo

# The one property a host application has to set.
sonify.enabled=true

# Left at their defaults; shown here so the demo documents what is tunable.
# sonify.base-path=/sonify
# sonify.tick=100ms
# sonify.max-clients=8
# sonify.events.contention-threshold=10ms
# sonify.events.park-threshold=20ms
# sonify.events.allocation-window=2s

management.endpoints.web.exposure.include=health,info,sonify

logging.level.net.bitsar.sonify=INFO
