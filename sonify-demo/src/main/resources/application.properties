spring.application.name=sonify-demo

# The one property a host application has to set.
sonify.enabled=true

# --- real PostgreSQL ------------------------------------------------------------------------
# Deliberately a small pool. Most of the database scenarios are about what happens when demand
# exceeds it, which is the single most common way a healthy application falls over.
spring.datasource.url=jdbc:postgresql://localhost:5432/sonify
spring.datasource.username=${USER:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=sonify-pool
# Hikari's own leak detector, so its warnings line up with what the monitor is showing.
spring.datasource.hikari.leak-detection-threshold=20000

# --- real Redis -----------------------------------------------------------------------------
# The schema already exists and is owned by migrations, so Hibernate only validates it.
# open-in-view is off, as it should be in production: it keeps a connection checked out for the
# whole request and hides lazy loading behind the view layer.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5s

# --- the stand-in third-party API, run as its own process -----------------------------------
scenarios.upstream.base-url=http://localhost:8090

# Left at the container default so the thread-per-request scenarios hit a realistic ceiling.
server.tomcat.threads.max=200

management.endpoints.web.exposure.include=health,info,sonify

logging.level.net.bitsar.sonify=INFO
logging.level.com.zaxxer.hikari=INFO
